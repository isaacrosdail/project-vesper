{% extends "base.html" %}
{% block title %}Tasks{% endblock %}
{% block sidebar_left %}
    {% call ui.left_sidebar('left-sidebar--tasks') %}
        <div class="sidebar-section">
            <button class="btn btn-primary sidebar-option" id="tasks-entry-dashboard-btn">
                <svg class="icon">
                    <use href="#icon-plus"></use>
                </svg>
                <span class="sidebar-label">Add Task</span>
            </button>
            <button class="sidebar-option btn-ghost" popovertarget="search-popover">
                <svg class="icon">
                    <use href="#icon-search"></use>
                </svg>
                <span class="sidebar-label">Search</span>
            </button>
        </div>
    {% endcall %}
{% endblock %}
{% block content %}
    <div id="tasks-dashboard-root" class="page"></div>
{% endblock %}
{% block scripts %}{% endblock %}
